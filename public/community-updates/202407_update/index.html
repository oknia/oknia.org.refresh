<meta name=viewport content="width=device-width,minimum-scale=1"><meta name=description content="OKNIA.org is a community based 501 (C3) nonprofit formed to enhance the livability of the neighborhoods surrounding KEOS. We do this by establishing and maintaining an open line of communication and liaison among the neighbors, government agencies and other neighborhoods.
Because of ongoing City budget constraints and competing priorities, OKNIA.org directs a lot of time and attention toward maintaining our local open space.
                                                                   
Here is what OKNIA volunteers have accomplished in King Estate Open Space since July 2023:
- New entrance bulletin boards and incised KEOS signage (funded by a grant from Keep Oakland Beautiful) 
- New low retaining walls to protect trails from erosion in selected locations                                                            
- Ongoing invasive species control, including Himalayan blackberry, mustard species, Italian thistle and fumaria.
- Ditches to aid winter groundwater drainage along Greenly Trail
- 25 native oak trees planted and protected by goat exclusion fences (with A-Plus Tree LLC and a Cal Fire grant) near 82nd Avenue Entrance
- Ongoing grafitti control 
- Plus trash removal along Fontaine Street
